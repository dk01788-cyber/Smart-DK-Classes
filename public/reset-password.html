<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Choose a new Smart DK Classes password.">
  <title>Set New Password | Smart DK Classes</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/assets/js/demo-data.js"></script>
  <script defer src="/assets/js/sdk.js"></script>
  <script defer src="/assets/js/layout.js"></script>
</head>
<body><div id="app-header"></div>
<section class="auth-section">
  <form id="reset-password-form" class="auth-card">
    <img src="/assets/img/logo.svg" alt="Smart DK Classes">
    <h1>Set New Password</h1>
    <p>Email में आए reset link से यहाँ नया password सेट करें।</p>
    <div id="reset-password-msg"></div>
    <label>New Password<input class="input" type="password" id="new-password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirm Password<input class="input" type="password" id="confirm-password" autocomplete="new-password" minlength="8" required></label>
    <small class="password-help">कम-से-कम 8 characters रखें।</small>
    <button class="btn primary full" type="submit">Update Password</button>
    <p><a class="text-link" href="/login.html">Back to Login</a></p>
  </form>
</section>
<div id="app-footer"></div><script defer src="/assets/js/auth.js"></script></body></html>

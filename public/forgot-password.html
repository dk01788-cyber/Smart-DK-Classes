<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reset Smart DK Classes student password.">
  <title>Forgot Password | Smart DK Classes</title>
  <link rel="icon" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/assets/js/demo-data.js"></script>
  <script defer src="/assets/js/sdk.js"></script>

</head>
<body><div id="app-header"></div>
<section class="auth-section">
  <form id="forgot-password-form" class="auth-card">
    <img src="/assets/img/logo.svg" alt="Smart DK Classes">
    <h1>Forgot Password</h1>
    <p>अपना registered email डालें। हम password reset link भेजेंगे।</p>
    <div id="forgot-password-msg"></div>
    <label>Email<input class="input" type="email" id="forgot-email" autocomplete="email" required></label>
    <button class="btn primary full" type="submit">Send Reset Link</button>
    <p><a class="text-link" href="/login.html">← Back to Login</a></p>
  </form>
</section>
<div id="app-footer"></div><script defer src="/assets/js/auth.js"></script></body></html>
